resourceLifecycle:
  - step: 1
    action: azd up
    ownership: tool
    note: Provisions account, Azure OpenAI, RBAC, and the create-index database; postprovision hook restores data files.
  - step: 2
    action: Control-plane create and verify containers
    ownership: sample-code
    plane: control-plane
  - step: 3
    action: Data-plane insert documents and query
    ownership: sample-code
    plane: data-plane
  - step: 4
    action: Control-plane container cleanup
    ownership: sample-code
    plane: control-plane
  - step: 5
    action: Local generated-artifact cleanup
    ownership: cleanup
  - step: 6
    action: Explicit confirmation
    ownership: tool
  - step: 7
    action: azd down
    ownership: tool

forbiddenGuidance:
  - item: Connection strings
    citation: "QUICKSTART-CONSTITUTION.md § II.2.1"
  - item: Account keys
    citation: "QUICKSTART-CONSTITUTION.md § II.2.1"
  - item: Public OpenAI keys
    citation: "QUICKSTART-CONSTITUTION.md § II.2.1"
  - item: Hardcoded credentials
    citation: "QUICKSTART-CONSTITUTION.md § II.2.1"
  - item: Database create/update/delete from sample code
    citation: "CREATE-INDEX-CONSTITUTION.md § III.3.1"
  - item: Arbitrary container deletion
    citation: "CREATE-INDEX-CONSTITUTION.md § III.3.2"
  - item: Direct resource-group deletion
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
  - item: Language-suffixed container names (_py, _ts, _java, _go, _dotnet)
    citation: "CREATE-INDEX-CONSTITUTION.md § I.1.1"
  - item: Manual data copying instead of the azd postprovision hook
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"

expectedOutput:
  finalTable:
    description: Six-row Markdown results table — DiskANN and QuantizedFlat × Cosine, DotProduct, Euclidean
    rowCount: 6
    citation: "CREATE-INDEX-CONSTITUTION.md § VI"
  completionRule:
    description: "'Complete' printed only after cleanup succeeds"
    citation: "CREATE-INDEX-CONSTITUTION.md § VI item 8"

