sharedConcepts:
  - conceptId: passwordless-authentication
    extendsSpineConcept: 5-authenticate-securely
    authorityLocator: "QUICKSTART-CONSTITUTION.md § II.2.1 Passwordless Authentication (Primary)"
    summary: DefaultAzureCredential for Cosmos DB and Azure OpenAI

  - conceptId: upfront-env-validation
    extendsSpineConcept: 4-provision-and-configure
    authorityLocator: "QUICKSTART-CONSTITUTION.md § III.3.1 Upfront Validation Timing"
    summary: Validate all environment variables before any client operations

  - conceptId: field-name-whitelist-validation
    extendsSpineConcept: 6-run-and-understand-the-code
    authorityLocator: "QUICKSTART-CONSTITUTION.md § IV.4.2 Field Name Validation Whitelist"
    summary: Regex ^[A-Za-z_][A-Za-z0-9_]*$ before SQL interpolation

  - conceptId: vector-distance-query-syntax
    extendsSpineConcept: 6-run-and-understand-the-code
    authorityLocator: "QUICKSTART-CONSTITUTION.md § V.5.1 Approved Query Syntax"
    summary: VectorDistance() with TOP and ORDER BY

  - conceptId: forbidden-mongo-wire-protocol
    extendsSpineConcept: 6-run-and-understand-the-code
    authorityLocator: "QUICKSTART-CONSTITUTION.md § V.5.1 Approved Query Syntax"
    summary: No $search, cosmosSearch, createIndexes, or MongoDB wire protocol

  - conceptId: one-sdk-generation-per-surface
    extendsSpineConcept: 6-run-and-understand-the-code
    authorityLocator: "QUICKSTART-CONSTITUTION.md § VI.6.1 Dependency Governance"
    summary: One supported SDK generation per service surface

  - conceptId: cross-language-parity
    extendsSpineConcept: 6-run-and-understand-the-code
    authorityLocator: "QUICKSTART-CONSTITUTION.md § VI.6.2 Cross-Language Authority"
    summary: No reference implementation; five languages maintain parity

  - conceptId: env-template-rule
    extendsSpineConcept: 4-provision-and-configure
    authorityLocator: "QUICKSTART-CONSTITUTION.md § III.3.2 Language-Native Configuration Patterns"
    summary: Committed .env.example or appsettings.json template per sample; runtime files gitignored

  - conceptId: language-config-loading
    extendsSpineConcept: 4-provision-and-configure
    authorityLocator: "QUICKSTART-CONSTITUTION.md § III.3.2 Language-Native Configuration Patterns"
    summary: Language-native configuration loading behavior per the base constitution table

