knownTargetDrift:
  - id: obsolete-language-suffixed-container-names
    description: Articles use language-suffixed container names instead of hotels_diskann and hotels_quantizedflat
    citation: "CREATE-INDEX-CONSTITUTION.md § I.1.1"
  - id: manual-data-copy
    description: Articles tell readers to copy data manually instead of explaining the azd postprovision hook
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
  - id: missing-allow-destructive-operations
    description: Articles omit AZURE_COSMOSDB_CREATE_INDEX_ALLOW_DESTRUCTIVE_OPERATIONS
    citation: "CREATE-INDEX-CONSTITUTION.md § I.1.2"
  - id: missing-configurable-container-names
    description: Articles omit the two configurable container-name variables
    citation: "CREATE-INDEX-CONSTITUTION.md § I.1.1"
  - id: missing-shared-validator-and-cleanup
    description: Articles omit the shared validator and local generated-artifact cleanup
    citation: "CREATE-INDEX-CONSTITUTION.md § VII.7.2, VII.7.3"
  - id: missing-azd-down
    description: Articles omit the final azd down resource teardown
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
  - id: inconsistent-lifecycle
    description: Articles fail to present one consistent end-to-end lifecycle across all languages
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
  - id: typescript-wrong-openai-endpoint
    description: TypeScript article uses AZURE_OPENAI_ENDPOINT instead of AZURE_OPENAI_EMBEDDING_ENDPOINT
    citation: "CREATE-INDEX-CONSTITUTION.md § II.2.2"
  - id: typescript-forbidden-data-file-fallback
    description: TypeScript article uses forbidden DATA_FILE_WITH_VECTORS fallback
    citation: "CREATE-INDEX-CONSTITUTION.md § I.1.2"
  - id: typescript-direct-resource-group-deletion
    description: TypeScript article recommends direct resource-group deletion
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
  - id: dotnet-direct-resource-group-deletion
    description: .NET article recommends direct resource-group deletion
    citation: "CREATE-INDEX-CONSTITUTION.md § IX"
